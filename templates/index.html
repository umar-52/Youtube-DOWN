<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tube Down - All-in-One</title>
<script async="async" data-cfasync="false" src="https://pl29412248.profitablecpmratenetwork.com/db1ef87f3a1fddb2dccb16fd3d0ad40c/invoke.js"></script>
<div id="container-db1ef87f3a1fddb2dccb16fd3d0ad40c"></div>
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            align-self: center;
        }

        h1 { font-size: 2.2rem; margin: 0; text-align: center; font-weight: 800; }
        p { text-align: center; opacity: 0.8; margin-bottom: 25px; }

        .input-box {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            display: flex;
            padding: 5px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px 15px;
            outline: none;
            font-size: 16px;
        }

        .btn-preview {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }

        #preview-section { display: none; }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        .btn-download {
            background: #2196F3;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #status { margin-top: 15px; text-align: center; font-size: 14px; color: #ffeb3b; }
    </style>
</head>
<body>

<div class="glass-card">
    <h1>Tube Down</h1>
    <p>Discover. Watch. Enjoy.</p>

    <div class="input-box">
        <input type="text" id="videoUrl" placeholder="Paste YouTube link...">
        <button class="btn-preview" onclick="loadPreview()">Preview</button>
    </div>

    <div id="preview-section">
        <div class="video-container">
            <iframe id="player" src="" allowfullscreen></iframe>
        </div>
        <button class="btn-download" onclick="startDownload()">Download to Device</button>
        <div id="status"></div>
    </div>
</div>

<script>
    async function loadPreview() {
        const url = document.getElementById('videoUrl').value;
        if(!url) return;
        document.getElementById('status').innerText = "Loading player...";
        
        const res = await fetch('/get_preview', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({url: url})
        });
        const data = await res.json();
        
        if(data.embed_url) {
            document.getElementById('preview-section').style.display = 'block';
            document.getElementById('player').src = data.embed_url;
            document.getElementById('status').innerText = "";
        }
    }

    async function startDownload() {
        const url = document.getElementById('videoUrl').value;
        const status = document.getElementById('status');
        status.innerText = "Downloading... (Wait 1-2 mins)";

        try {
            const response = await fetch('/download', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url: url})
            });

            if (response.ok) {
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = "video_download.mp4";
                document.body.appendChild(a);
                a.click();
                a.remove();
                status.innerText = "✅ Saved to your Gallery/Downloads!";
            } else {
                status.innerText = "❌ Download failed!";
            }
        } catch (e) {
            status.innerText = "❌ Error: " + e;
        }
    }
</script>

</body>
</html>
